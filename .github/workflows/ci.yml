name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest

      - name: Eval harness self-check + regression gate (v1)
        # Deterministic oracle replay (no API key). Fails CI if the harness
        # pipeline regresses below the threshold.
        run: python -m app.eval --oracle --in-process-mock --min-pass-rate 0.9

      - name: Eval harness self-check + gate (v2 hard dataset)
        run: >-
          python -m app.eval --dataset eval/datasets/hard_v2.jsonl
          --oracle --in-process-mock --reset-state --min-pass-rate 0.9

      - name: Load test smoke
        run: python -m app.bench --runs 20 --concurrency 5
